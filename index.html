<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>슬라이드</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/images/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="src/theme.css">
  <link rel="stylesheet" href="src/motion.css">
  <script type="module" src="src/app.js"></script>
  <script type="module" src="src/motion.js"></script>
</head>
<body>
  <main class="deck" aria-roledescription="슬라이드 덱"></main>

  <nav class="nav" aria-label="슬라이드 내비게이션">
    <button type="button" class="nav__button nav__button--prev" aria-label="이전 슬라이드" disabled>‹</button>
    <button type="button" class="nav__button nav__button--next" aria-label="다음 슬라이드" disabled>›</button>
  </nav>

  <div class="progress" role="progressbar" aria-label="발표 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="progress__bar"></div>
  </div>

  <div class="page-number" aria-live="polite"></div>
</body>
</html>
